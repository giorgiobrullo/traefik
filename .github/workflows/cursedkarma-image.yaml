name: Build cursedkarma image

# The fork's own image: v3.7.x plus server-side ECH and the patched quic-go, for the cursedkarma
# saltbox (amd64 only).
on:
  push:
    branches:
      - cursedkarma
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cursedkarma
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=3.7.14-cursedkarma
          tags: |
            ghcr.io/${{ github.repository_owner }}/traefik:cursedkarma
            ghcr.io/${{ github.repository_owner }}/traefik:cursedkarma-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
